name: Product or roadmap proposal
description: Propose public product direction, a feature, or a milestone
title: "[Proposal]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This public tracker is for non-sensitive product direction, roadmap proposals, and milestones. Do not file product bugs, incidents, private implementation details, credentials, customer data, or sensitive vulnerabilities here. Authorized community members should use their community's role-gated Discord bug intake. If that path is unavailable, follow the public bug-reporting guidance in the issue chooser.
  - type: input
    id: summary
    attributes:
      label: Proposal summary
      description: Describe the desired product outcome in one sentence.
      placeholder: What capability or direction should be considered?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Community web application
        - Admin web application
        - API or integration
        - Discord or Corrade bot
        - LSL or in-world object
        - Deployment or infrastructure
        - Data, database, or migrations
        - Multiple, other, or unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Explain the user, community, or operational need without including private implementation or incident details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what users or communities should be able to accomplish.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Suggested scope
      description: Identify useful boundaries, stages, or explicitly excluded work.
    validations:
      required: true
  - type: textarea
    id: benefits
    attributes:
      label: Benefits and affected users
      description: Who benefits, and how would success be observed?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Note existing approaches or reasons they are insufficient.
  - type: textarea
    id: relationships
    attributes:
      label: Related roadmap items
      description: Link related public proposals, milestones, or decisions. Do not link private implementation records.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: "This is a public product or roadmap proposal, not a bug, incident, or private implementation task."
          required: true
        - label: "I did not include secrets, credentials, private customer data, or sensitive vulnerability details."
          required: true
